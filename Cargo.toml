[package]
name = "scrape"
version = "0.1.0"
edition = "2021"

[dependencies]
# glow (OpenGL) instead of the default wgpu backend: ~200 MB less private memory per window.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "system_fonts"] }
# Feature unification: brings back winit's default features that eframe's default-features = false drops.
winit = "0.30"
wry = "0.57"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "ico"] }
rfd = "0.18"
ureq = { version = "3", features = ["json"] }
sysinfo = "0.40"

[build-dependencies]
winres = "0.1"
